[project]
name = "buildq-benchmarks"
version = "0.1.0"
description = "Reproducible Bevy build benchmarks and README figures"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.8",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
