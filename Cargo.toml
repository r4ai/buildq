[package]
name = "buildq"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Machine-wide queue and shared, disk-budgeted target-dir pool for cargo jobs started by many parallel agents"
readme = "README.md"
keywords = ["cargo", "build", "queue", "cache", "agents"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
cfg-expr = { version = "0.20", default-features = false }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Selected pedantic lints catch mistakes without requiring broad API rewrites.
checked_conversions = "warn"
copy_iterator = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
naive_bytecount = "warn"
