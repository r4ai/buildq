version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /tests/fixtures/sample-ws
      - /scripts/fixtures/bevy-heavy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
