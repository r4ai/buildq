name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # cargo fmt has no --locked option and does not resolve dependencies.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: python3 -m unittest discover -s scripts -p test_release.py
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo test --locked --all-features
      - name: Fetch offline E2E fixture dependencies
        run: cargo fetch --locked --manifest-path tests/fixtures/sample-ws/Cargo.toml
      - name: Real Cargo E2E (including Windows DLL handling)
        run: cargo test --locked --all-features --test e2e -- --ignored --nocapture --test-threads=1
      - name: Real rsync transport E2E
        if: runner.os != 'Windows'
        run: cargo test --locked --all-features --test rsync -- --ignored --nocapture

  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM coverage tools for the pinned toolchain
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Run unit and integration tests with coverage
        run: cargo llvm-cov --locked --all-features --no-report
      - name: Generate coverage reports
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --html --output-dir target/llvm-cov
          cargo llvm-cov report
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: target/llvm-cov/
          if-no-files-found: error
          retention-days: 14

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read declared MSRV
        id: msrv
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check all targets on MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          cargo +"$MSRV" check --locked --all-targets --all-features

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database authenticates module content; no curl | sh.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows (including embedded shell)
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  ci:
    name: CI passed
    if: always()
    needs: [quality, test, coverage, msrv, dependencies, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = success,success,success,success,success,success
